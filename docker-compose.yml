services:
  frontend:
    image: node:24-alpine
    container_name: create-step-tool-frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm ci && npm run dev -- --host --port 8002"
    restart: unless-stopped

  backend:
    image: node:24-alpine
    container_name: create-step-tool-backend
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
    environment:
      - PORT=8003
    command: sh -c "node server.js"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: create-step-tool-nginx
    depends_on:
      - frontend
      - backend
    expose:
      - "8001"
    networks:
      - default
      - shared-gateway-net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  shared-gateway-net:
    external: true
